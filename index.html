<!DOCTYPE html>
<html lang="pt-br" class="scrollbar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SavePoint - Home</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <section>
            <h1 class="logo">Logo</h1>
        </section>
        <section class="search-bar">
            <div class="search-bar-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </div>
            <input class="search-bar-input" type="text" placeholder="Pesquisar produto" />
        </section>
        <nav>
            <a href="index.html">
                <li>
                    Home
                </li>
            </a>
            <a href="assist.html">
                <li>
                    Assistência
                </li>
            </a>
            <a href="login.html">
                <li>
                    Logar
                </li>
            </a>
        </nav>
    </header>
    <main>
        <section>
            <img class="banner" src="assets/banner.jpg" alt="Banner" />
        </section>
        <section class="prouctsMain">
            <section class="carrosselContainer prouctsMain">
                <button id="btnVoltarBanner" class="btn-bolinha left">&#10094;</button>
                <section id="bannerCard" class="displayBanner limitMain">
                </section>
                <button id="btnAvancarBanner" class="btn-bolinha right">&#10095;</button>
            </section>

            <section class="limitMain">
                <h2>Promoções</h2>
                <section class="carrosselContainer">
                    <button id="btnVoltarPromo" class="btn-bolinha left">&#10094;</button>
                    <div id="cardPromo" class="productSecundary"></div>
                    <button id="btnAvancarPromo" class="btn-bolinha right">&#10095;</button>
                </section>
            </section>
            <section  class="limitMain">
                <h2>Mais vendidos</h2>
                <section class="carrosselContainer">
                    <button id="btnVoltarVend" class="btn-bolinha left">&#10094;</button>
                    <div id="cardVend" class="productSecundary"></div>
                    <button id="btnAvancarVend" class="btn-bolinha right">&#10095;</button>
                </section>
            </section>
        </section>
    </main>
    <footer>
        <section class="textFooter"><strong style="color: #fff;">Projeto SavePoint</strong></section>
    </footer>
</body>

<script src="scriptIndex.js"></script>

</html>
