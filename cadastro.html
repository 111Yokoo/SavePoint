<!DOCTYPE html>
<html lang="pt-br" class="scrollbar">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SavePoint - Cadastro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <header>
        <section>
            <h1 class="logo"><a href="index.html">SavePoint</a></h1>
        </section>
        <nav>
            <a href="index.html">
                <li>
                    Home
                </li>
            </a>
            <a href="assist.html">
                <li>
                    Assistência
                </li>
            </a>
            <a href="login.html">
                <li>
                    Logar
                </li>
            </a>
        </nav>
    </header>
    <main class="loginMain">
        <section class="loginCard">
            <h2>Criar conta</h2>
            <p class="loginSub">Cadastre-se para comprar e agendar assistência técnica.</p>

            <form id="formCadastro" novalidate>
                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input id="nome" type="text" autocomplete="name" placeholder="Seu nome" />
                </div>

                <div class="campo">
                    <label for="rg">RG</label>
                    <input id="rg" type="text" placeholder="00.000.000-0" />
                </div>

                <div class="campo">
                    <label for="cpf">CPF</label>
                    <input id="cpf" type="text" placeholder="000.000.000-00" />
                </div>

                <div class="campo">
                    <label for="nascimento">Data de nascimento</label>
                    <input id="nascimento" type="date" />
                </div>

                <div class="campo">
                    <label for="telefone">Telefone</label>
                    <input id="telefone" type="tel" autocomplete="tel" placeholder="(16) 90000-0000" />
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input id="email" type="email" autocomplete="email" placeholder="voce@email.com" />
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input id="senha" type="password" autocomplete="new-password" placeholder="Crie uma senha" />
                </div>

                <div class="campo">
                    <label for="confirmarSenha">Confirmar senha</label>
                    <input id="confirmarSenha" type="password" autocomplete="new-password"
                        placeholder="Repita a senha" />
                </div>

                <small class="erro erroGeral" id="erroGeral" role="alert"></small>

                <button type="submit" class="btnEntrar">Cadastrar</button>
            </form>

            <p class="criarConta">
                Já tem conta?
                <a href="login.html" class="linkSecundario">Entrar</a>
            </p>
        </section>
    </main>

    <footer>
        <section class="textFooter"><strong style="color: #fff;">Projeto SavePoint</strong></section>
    </footer>
</body>

<script src="scripts/auth.js"></script>
<script src="scripts/scriptCadastro.js"></script>

</html>
